name: polydart
description: Dart-native Polymarket SDK — peer implementation to polygolem.
version: 0.1.0-alpha.2
homepage: https://github.com/TrebuchetDynamics/polydart
repository: https://github.com/TrebuchetDynamics/polydart
issue_tracker: https://github.com/TrebuchetDynamics/polydart/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  convert: ^3.1.0
  crypto: ^3.0.0
  http: ^1.2.0
  meta: ^1.12.0
  # Used directly for Keccak-256 so Flutter apps do not inherit a web3dart
  # major-version constraint only for crypto helpers.
  pointycastle: '>=3.7.0 <5.0.0'
  web_socket_channel: '>=2.4.0 <4.0.0'

dev_dependencies:
  async: ^2.11.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  lints: ^4.0.0
  mockito: ^5.4.0
  stream_channel: ^2.1.0
  test: ^1.25.0
  yaml: ^3.1.0
