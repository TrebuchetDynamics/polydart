<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Polydart operating modes</title>
  <desc id="desc">Read-only blocks writes and needs no wallet, paper mode simulates locally without funds, and lower-level live clients require an explicit mode, live flag, signer, credentials, confirmation, and preflight.</desc>

  <rect width="1200" height="420" rx="24" fill="#07131D"/>
  <text x="56" y="56" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="750">Choose the boundary before the client.</text>
  <text x="56" y="84" fill="#8FA4B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">OPERATING MODE DEFINES WHICH ACTIONS CAN PROCEED</text>

  <g id="modes" transform="translate(56 118)">
    <g id="read-only">
      <rect width="340" height="210" rx="16" fill="#0D2B3C" stroke="#40C4FF" stroke-width="1.5"/>
      <text x="24" y="36" fill="#8FDFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">START HERE</text>
      <text x="24" y="72" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750">readOnly</text>
      <text x="24" y="104" fill="#C6D2DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Public market and portfolio reads</text>
      <path d="M24 126H316" stroke="#2A4658"/>
      <g transform="translate(24 152)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
        <circle cx="6" cy="0" r="4" fill="#00D2A0"/><text x="20" y="5" fill="#B8C8D3">NO WALLET</text>
        <circle cx="6" cy="32" r="4" fill="#00D2A0"/><text x="20" y="37" fill="#B8C8D3">WRITES BLOCKED</text>
      </g>
    </g>

    <g id="paper" transform="translate(374 0)">
      <rect width="340" height="210" rx="16" fill="#102231" stroke="#405B70"/>
      <text x="24" y="36" fill="#8FA4B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">LOCAL RESEARCH</text>
      <text x="24" y="72" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750">paper</text>
      <text x="24" y="104" fill="#C6D2DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Simulation with an EOA identity</text>
      <path d="M24 126H316" stroke="#2A4658"/>
      <g transform="translate(24 152)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
        <circle cx="6" cy="0" r="4" fill="#40C4FF"/><text x="20" y="5" fill="#B8C8D3">SIMULATED ONLY</text>
        <circle cx="6" cy="32" r="4" fill="#40C4FF"/><text x="20" y="37" fill="#B8C8D3">NO FUNDS</text>
      </g>
    </g>

    <g id="live" transform="translate(748 0)">
      <rect width="340" height="210" rx="16" fill="#171F27" stroke="#6E7C87" stroke-dasharray="6 5"/>
      <text x="24" y="36" fill="#A7B4BE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">LOWER-LEVEL CLIENTS</text>
      <text x="24" y="72" fill="#F4F7FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="750">live</text>
      <text x="24" y="104" fill="#C6D2DC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Signer-mediated protocol mutation</text>
      <path d="M24 126H316" stroke="#34444F"/>
      <g transform="translate(24 152)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
        <circle cx="6" cy="0" r="4" fill="#F4B860"/><text x="20" y="5" fill="#D2D9DE">EXPLICIT FLAG + SIGNER</text>
        <circle cx="6" cy="32" r="4" fill="#F4B860"/><text x="20" y="37" fill="#D2D9DE">READINESS + PREFLIGHT</text>
      </g>
    </g>
  </g>

  <g id="gate-sequence" transform="translate(56 362)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">
    <text x="0" y="0" fill="#40C4FF">MODE</text>
    <path d="M54-5h48m-8-6 8 6-8 6" fill="none" stroke="#405B70"/>
    <text x="118" y="0" fill="#C6D2DC">INTENT</text>
    <path d="M180-5h48m-8-6 8 6-8 6" fill="none" stroke="#405B70"/>
    <text x="244" y="0" fill="#C6D2DC">SIGNER</text>
    <path d="M306-5h48m-8-6 8 6-8 6" fill="none" stroke="#405B70"/>
    <text x="370" y="0" fill="#C6D2DC">CREDENTIALS</text>
    <path d="M470-5h48m-8-6 8 6-8 6" fill="none" stroke="#405B70"/>
    <text x="534" y="0" fill="#C6D2DC">CONFIRMATION</text>
    <path d="M650-5h48m-8-6 8 6-8 6" fill="none" stroke="#405B70"/>
    <text x="714" y="0" fill="#C6D2DC">PREFLIGHT</text>
    <path d="M790-5h48m-8-6 8 6-8 6" fill="none" stroke="#405B70"/>
    <text x="854" y="0" fill="#00D2A0">MUTATION</text>
  </g>
</svg>
